name: Publication rehearsal
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rehearse authenticated Git reads without persisted checkout credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git --hostname github.com
          git ls-remote --exit-code origin refs/heads/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/release-plan.test.mjs test/source-commits.test.mjs test/production-providers.test.mjs test/incremental.test.mjs test/publish.test.mjs test/transports.test.mjs
      - run: npm run publish:dry-run
