name: Validate Skill Marketplace
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full matrix instead of the focused Windows source audit
        type: boolean
        default: false
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name != 'workflow_dispatch' || inputs.full) && fromJSON('["ubuntu-latest","windows-latest","macos-latest"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - if: github.event_name != 'workflow_dispatch' || inputs.full
        run: npm run format:check
      - if: github.event_name != 'workflow_dispatch' || inputs.full
        run: npm test
      - if: github.event_name != 'workflow_dispatch' || inputs.full
        run: npm run validate
      - if: github.event_name != 'workflow_dispatch' || inputs.full
        run: npm run publish:dry-run
      - name: Read the fixed upstream Git snapshot
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: "true"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aipoch/medical-research-skills
          ref: d92441066ea6259967469be8e0c8c7b6587928ab
          path: dist/upstream
          persist-credentials: false
      - run: npm run audit:sources -- --source dist/upstream --check
